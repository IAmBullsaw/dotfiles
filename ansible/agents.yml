# Sets up agents-sync from dotfiles/.agents. No root required.
#
# Include from your dotfiles playbook, e.g.:
#   - import_tasks: ansible/agents.yml
#     tags: [agents]
#
# Variables:
#   dotfiles_dir       path to the dotfiles checkout              (default: ~/dotfiles)
#   agents_work_dir    work repo's .agents folder, optional       (default: ~/dotwork/.agents)
#   agents_sync_apply  run `agents-sync sync` for real            (default: false → plan only)
#   agents_targets     CLIs to wire, space-separated: kiro, claude (default: kiro)
#                      Named targets get their ~/.kiro / ~/.claude folders created and
#                      are remembered. Set to "" on a machine without either CLI.
#
# Ansible only links the CLI and calls it. ~/.agents (the generated merged view)
# and every tool link are created by agents-sync, so its manifest stays the
# single record of what was created. It never passes --adopt: migrating an old
# ~/.agents link or a hand-written ~/.claude/CLAUDE.md is a one-time manual step
# (`agents-sync sync --adopt`, after reading the dry run).

- name: agents | resolve paths
  ansible.builtin.set_fact:
    _agents_src: "{{ dotfiles_dir | default(ansible_env.HOME ~ '/dotfiles') }}/.agents"
    _agents_work: "{{ agents_work_dir | default(ansible_env.HOME ~ '/dotwork/.agents') }}"
    _agents_bin: "{{ ansible_env.HOME }}/.local/bin"
    _agents_apply: "{{ agents_sync_apply | default(false) | bool }}"
    _agents_targets: "{{ agents_targets | default('kiro') }}"

- name: agents | check for agents-sync
  ansible.builtin.stat:
    path: "{{ _agents_src }}/bin/agents-sync"
  register: _agents_sync_stat

- name: agents | fail if dotfiles/.agents is missing
  ansible.builtin.fail:
    msg: "{{ _agents_src }}/bin/agents-sync not found. Is dotfiles_dir correct?"
  when: not _agents_sync_stat.stat.exists

- name: agents | ensure ~/.local/bin
  ansible.builtin.file:
    path: "{{ _agents_bin }}"
    state: directory
    mode: "0755"

- name: agents | link agents-sync into ~/.local/bin
  ansible.builtin.file:
    src: "{{ _agents_src }}/bin/agents-sync"
    dest: "{{ _agents_bin }}/agents-sync"
    state: link

- name: agents | validate content
  ansible.builtin.command: >-
    {{ _agents_src }}/bin/agents-sync --personal {{ _agents_src }} --work {{ _agents_work }} check
  changed_when: false
  check_mode: false          # read-only, so it runs in --check too

- name: agents | plan (dry run)
  ansible.builtin.command: >-
    {{ _agents_src }}/bin/agents-sync --personal {{ _agents_src }} --work {{ _agents_work }} sync {{ _agents_targets }} --dry-run
  register: _agents_plan
  changed_when: false
  check_mode: false
  # exit 1 = conflicts: shown below, and the apply step then stops on them
  failed_when: _agents_plan.rc not in [0, 1]

- name: agents | show plan
  ansible.builtin.debug:
    var: _agents_plan.stdout_lines

- name: agents | apply
  ansible.builtin.command: >-
    {{ _agents_src }}/bin/agents-sync --personal {{ _agents_src }} --work {{ _agents_work }} sync {{ _agents_targets }}
  register: _agents_apply_out
  changed_when: "'no changes' not in _agents_apply_out.stdout"
  when: _agents_apply
