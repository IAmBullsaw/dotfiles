font_family      FiraCode
bold_font        FiraCode Bold
italic_font      auto
bold_italic_font auto
font_size 10.0
cursor_shape block
enable_audio_bell no
remember_window_size  yes

# Remote control (enables kitty @ commands from child processes)
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

background_opacity 0.85

# Nerd Fonts v3.2.0
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

tab_title_template "{index}: {title}"

# Theme
include current-theme.conf

map ctrl+alt+o launch --type=overlay --cwd=current
enabled_layouts splits,stack

# Window borders: always show active window with a colored frame
window_border_width 2px
draw_minimal_borders no
draw_window_borders_for_single_window yes
active_border_color #00ff7f
inactive_border_color #313244

# OS-level window navigation (kitty splits)
map alt+h kitten kittens/smart_nav.py left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l kitten kittens/smart_nav.py right

# ============================================================================
# Modal keyboard. ctrl+space enters kitty_mode; the border colour shows the
# active mode. escape returns to normal (green); resize and move mode also
# accept enter and space.
#
#   kitty_mode   red    #e06c75   splits, tabs, windows
#     hjkl  focus split          t  new tab       n/p  next/prev tab
#     1-4   goto tab             shift+k  kiro tab    q  close window
#                                 shift+v  vibbe tab
#     r     rename tab           d  -> detach_mode (1-4: move to tab N, or new tab if N doesn't exist)
#     w  -> resize_mode          m  -> move_mode
#     NOTE: single-char key names are lowercased by kitty. Write shift+k, not K.
#
#   resize_mode  blue   #89b4fa   resize the OS window edge by edge
#     h/l  shrink/grow right edge      a/f  grow/shrink left edge
#     j/k  grow/shrink bottom edge     s/d  grow/shrink top edge
#
#   move_mode    mauve  #cba6f7   position the OS window
#     hjkl        nudge 50px       ctrl+hjkl  nudge 250px
#     shift+hjkl  half screen (left/bottom/top/right)
#     1/2/3/4     quarter (TL/TR/BL/BR)
#     f  fullscreen toggle (saves/restores size)   m  maximize toggle
#     shift+f  fill work area    c  center
# ============================================================================
# Modal keyboard: ctrl+space enters kitty mode
map --new-mode kitty_mode --on-unknown passthrough ctrl+space
map ctrl+space combine : remote_control set-colors --all "active_border_color=#e06c75" : push_keyboard_mode kitty_mode

map --mode=kitty_mode h kitten kittens/smart_nav.py left
map --mode=kitty_mode l kitten kittens/smart_nav.py right
map --mode=kitty_mode j neighboring_window down
map --mode=kitty_mode k neighboring_window up
map --mode=kitty_mode t new_tab
map --mode=kitty_mode r combine : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : set_tab_title
map --mode=kitty_mode shift+k launch --tab-title kiro --type tab bash -ic 'kiro-cli chat'
map --mode=kitty_mode shift+v launch --type=tab ~/.config/kitty/kittens/launch_enumerated.sh "🌴Vibbe" kiro-cli chat --agent "🌴 Vibbe"
map --mode=kitty_mode 1 goto_tab 1
map --mode=kitty_mode 2 goto_tab 2
map --mode=kitty_mode 3 goto_tab 3
map --mode=kitty_mode 4 goto_tab 4
map --mode=kitty_mode q close_window
map --mode=kitty_mode n next_tab
map --mode=kitty_mode p previous_tab
map --new-mode detach_mode --on-unknown passthrough kitty_mod+d
map --mode=kitty_mode d combine : remote_control set-colors --all "active_border_color=#fab387" : push_keyboard_mode detach_mode

map --mode=detach_mode 1 combine : launch --type=background ~/.config/kitty/kittens/detach_window.sh 1 : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : pop_keyboard_mode
map --mode=detach_mode 2 combine : launch --type=background ~/.config/kitty/kittens/detach_window.sh 2 : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : pop_keyboard_mode
map --mode=detach_mode 3 combine : launch --type=background ~/.config/kitty/kittens/detach_window.sh 3 : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : pop_keyboard_mode
map --mode=detach_mode 4 combine : launch --type=background ~/.config/kitty/kittens/detach_window.sh 4 : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : pop_keyboard_mode
map --mode=detach_mode escape combine : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : pop_keyboard_mode
map --new-mode resize_mode --on-unknown passthrough kitty_mod+w
map --mode=kitty_mode w combine : remote_control set-colors --all "active_border_color=#89b4fa" : push_keyboard_mode resize_mode

map --mode=resize_mode h launch --type=background ~/.config/kitty/kittens/resize_step.sh w-
map --mode=resize_mode l launch --type=background ~/.config/kitty/kittens/resize_step.sh w+
map --mode=resize_mode j launch --type=background ~/.config/kitty/kittens/resize_step.sh h+
map --mode=resize_mode k launch --type=background ~/.config/kitty/kittens/resize_step.sh h-
map --mode=resize_mode a launch --type=background ~/.config/kitty/kittens/resize_step.sh xl+
map --mode=resize_mode f launch --type=background ~/.config/kitty/kittens/resize_step.sh xl-
map --mode=resize_mode s launch --type=background ~/.config/kitty/kittens/resize_step.sh yt-
map --mode=resize_mode d launch --type=background ~/.config/kitty/kittens/resize_step.sh yt+
map --mode=resize_mode escape combine : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : pop_keyboard_mode
map --mode=resize_mode enter combine : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : pop_keyboard_mode
map --mode=resize_mode space combine : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : pop_keyboard_mode

# --- move_mode: position the whole OS window (mauve border) -----------------
map --new-mode move_mode --on-unknown passthrough kitty_mod+m
map --mode=kitty_mode m combine : remote_control set-colors --all "active_border_color=#cba6f7" : push_keyboard_mode move_mode

# Nudge (50px) and coarse nudge (250px)
map --mode=move_mode h launch --type=background ~/.config/kitty/kittens/window_place.sh move left
map --mode=move_mode j launch --type=background ~/.config/kitty/kittens/window_place.sh move down
map --mode=move_mode k launch --type=background ~/.config/kitty/kittens/window_place.sh move up
map --mode=move_mode l launch --type=background ~/.config/kitty/kittens/window_place.sh move right
map --mode=move_mode ctrl+h launch --type=background ~/.config/kitty/kittens/window_place.sh move left 250
map --mode=move_mode ctrl+j launch --type=background ~/.config/kitty/kittens/window_place.sh move down 250
map --mode=move_mode ctrl+k launch --type=background ~/.config/kitty/kittens/window_place.sh move up 250
map --mode=move_mode ctrl+l launch --type=background ~/.config/kitty/kittens/window_place.sh move right 250

# Half-screen snaps
map --mode=move_mode shift+h launch --type=background ~/.config/kitty/kittens/window_place.sh left
map --mode=move_mode shift+l launch --type=background ~/.config/kitty/kittens/window_place.sh right
map --mode=move_mode shift+k launch --type=background ~/.config/kitty/kittens/window_place.sh top
map --mode=move_mode shift+j launch --type=background ~/.config/kitty/kittens/window_place.sh bottom

# Quarter snaps
map --mode=move_mode 1 launch --type=background ~/.config/kitty/kittens/window_place.sh tl
map --mode=move_mode 2 launch --type=background ~/.config/kitty/kittens/window_place.sh tr
map --mode=move_mode 3 launch --type=background ~/.config/kitty/kittens/window_place.sh bl
map --mode=move_mode 4 launch --type=background ~/.config/kitty/kittens/window_place.sh br

# Fill / maximize / fullscreen / center
map --mode=move_mode f launch --type=background ~/.config/kitty/kittens/window_place.sh fullscreen-toggle
map --mode=move_mode m launch --type=background ~/.config/kitty/kittens/window_place.sh maximize
map --mode=move_mode shift+f launch --type=background ~/.config/kitty/kittens/window_place.sh full
map --mode=move_mode c launch --type=background ~/.config/kitty/kittens/window_place.sh center

map --mode=move_mode escape combine : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : pop_keyboard_mode
map --mode=move_mode enter combine : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : pop_keyboard_mode
map --mode=move_mode space combine : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode : pop_keyboard_mode
map --mode=kitty_mode escape combine : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode
map --mode=kitty_mode ctrl+space combine : remote_control set-colors --all "active_border_color=#00ff7f" : pop_keyboard_mode
map --when-focus-on var:IS_VIM=true ctrl+h
map --when-focus-on var:IS_VIM=true ctrl+j
map --when-focus-on var:IS_VIM=true ctrl+k
map --when-focus-on var:IS_VIM=true ctrl+l
startup_session ~/.config/work/kitty-session.conf

tab_bar_style custom
tab_bar_min_tabs 1
hide_window_decorations yes
